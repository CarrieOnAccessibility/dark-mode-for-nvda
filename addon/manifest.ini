name = nvdaDarkMode
summary = "NVDA Dark Mode"
description = """Makes NVDA's own windows, dialogs and menus dark: the NVDA menu, the Settings dialog, the Add-on Store and every other NVDA window. Follows the Windows light/dark setting by default, can be forced on or off, and steps aside automatically while a Windows High Contrast theme is active."""
